<!DOCTYPE html>
<html lang="en" data-theme="dark" data-density="comfortable">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | My Starred Repos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script defer src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../dashboard/style.css?v=202605261453">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
    }
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 2.5rem 2rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      position: relative;
      z-index: 1;
    }
    .logo-wrapper {
      width: 60px;
      height: 60px;
      border-radius: var(--radius-md);
      background: hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.15);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary-color);
    }
    .logo-wrapper i {
      width: 32px;
      height: 32px;
    }
    .login-title {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 800;
      margin: 0;
      background: linear-gradient(135deg, #fff 30%, var(--primary-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .login-subtitle {
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.5;
      margin: 0;
    }
    .github-login-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-md);
      background: var(--primary-color);
      color: #ffffff;
      font-family: var(--font-display);
      font-size: 0.92rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.35);
      text-decoration: none;
      margin-top: 1rem;
    }
    .github-login-btn:hover {
      background: hsl(var(--primary-h), var(--primary-s), calc(var(--primary-l) - 5%));
      transform: translateY(-2px);
      box-shadow: 0 6px 20px hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.5);
    }
    .github-login-btn i {
      width: 18px;
      height: 18px;
    }
    .home-link {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-decoration: none;
      transition: color 0.2s;
    }
    .home-link:hover {
      color: var(--text-color);
    }
  </style>
</head>
<body>
  <!-- Deep Glass Background Blobs -->
  <div class="blob blob-1" style="width: 400px; height: 400px; top: -100px; left: -100px;"></div>
  <div class="blob blob-2" style="width: 350px; height: 350px; bottom: -100px; right: -100px;"></div>

  <div class="login-container glass-card">
    <div class="logo-wrapper">
      <i data-lucide="shield-alert"></i>
    </div>
    
    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
      <h1 class="login-title">Admin Analytics</h1>
      <p class="login-subtitle">Secure sign-in for owner @AkashPriyadarshii. Tracking stats, usage, and traffic dynamics.</p>
    </div>

    <button id="login-btn" class="github-login-btn">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-right: 8px;"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path></svg>
      <span>Sign in with GitHub</span>
    </button>

    <a href="../dashboard/index.html" class="home-link">
      <i data-lucide="arrow-left" style="width: 12px; height: 12px; display: inline-block; vertical-align: middle;"></i>
      Back to Portfolio
    </a>
  </div>

  <script type="module">
    import { ADMIN_CONFIG } from './config.js';

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) {
        window.lucide.createIcons();
      }

      const loginBtn = document.getElementById('login-btn');
      loginBtn.addEventListener('click', () => {
        const state = crypto.randomUUID();
        sessionStorage.setItem('oauth_state', state);
        const params = new URLSearchParams({
          client_id: ADMIN_CONFIG.OAUTH_CLIENT_ID,
          redirect_uri: ADMIN_CONFIG.REDIRECT_URI,
          scope: 'read:user',
          state
        });
        window.location.href = `https://github.com/login/oauth/authorize?${params}`;
      });
    });
  </script>
</body>
</html>
