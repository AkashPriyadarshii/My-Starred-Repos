<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — AkashPriyadarshii Starred Repos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: #0a0a0f;
      color: #e2e8f0;
      font-family: 'Outfit', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1.5rem;
      padding: 2rem;
      text-align: center;
    }

    .glow-ring {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, #6d28d9 0%, #0a0a0f 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 3s ease-in-out infinite;
      box-shadow: 0 0 40px rgba(109, 40, 217, 0.4);
    }

    .glow-ring svg {
      width: 56px;
      height: 56px;
      stroke: #c4b5fd;
      stroke-width: 1.5;
      fill: none;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 40px rgba(109,40,217,0.4); }
      50% { box-shadow: 0 0 80px rgba(109,40,217,0.8), 0 0 120px rgba(109,40,217,0.3); }
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: #94a3b8;
      font-size: 1rem;
      max-width: 320px;
      line-height: 1.6;
    }

    .retry-btn {
      margin-top: 0.5rem;
      padding: 0.75rem 2rem;
      background: linear-gradient(135deg, #6d28d9, #4f46e5);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      min-height: 48px;
    }

    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(109,40,217,0.4);
    }

    .retry-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="glow-ring">
    <svg viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
    </svg>
  </div>

  <h1>You're Offline</h1>
  <p>Can't reach the repository database right now. Connect to the internet and try again.</p>
  <button class="retry-btn" onclick="window.location.reload()">
    🔄 Retry Connection
  </button>
</body>
</html>
