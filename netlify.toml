[build]
  functions = "netlify/functions"

# ── CORS headers for all serverless functions ─────────────────
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin  = "https://akashpriyadarshii.github.io"
    Access-Control-Allow-Headers = "Content-Type, x-admin-secret"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"

# ── Pretty redirect aliases (optional) ───────────────────────
# So the admin dashboard can call /api/log-visit instead of the full /.netlify/... path
[[redirects]]
  from   = "/api/log-visit"
  to     = "/.netlify/functions/log-visit"
  status = 200

[[redirects]]
  from   = "/api/get-analytics"
  to     = "/.netlify/functions/get-analytics"
  status = 200
