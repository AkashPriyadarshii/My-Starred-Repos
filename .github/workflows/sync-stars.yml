name: Sync Starred Repos
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch starred repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: AkashPriyadarshii
        run: python fetch_stars.py

      - name: Build site
        run: python build_site.py

      - name: Update profile README badge count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(python -c "import json; print(json.load(open('repos_output.json'))['total_repos'])")
          gh api repos/AkashPriyadarshii/AkashPriyadarshii/contents/README.md --jq '.content' | base64 -d > /tmp/profile_readme.md
          sed -i "s|dashboard of [0-9]* curated starred repos|dashboard of ${COUNT} curated starred repos|" /tmp/profile_readme.md
          SHA=$(gh api repos/AkashPriyadarshii/AkashPriyadarshii/contents/README.md --jq '.sha')
          gh api -X PUT repos/AkashPriyadarshii/AkashPriyadarshii/contents/README.md \
            -f message="[auto] update starred count to ${COUNT}" \
            -f content=$(base64 -w0 /tmp/profile_readme.md) \
            -f sha=$SHA

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repos_output.json index.html llms.txt llms-full.txt
          git diff --staged --quiet || git commit -m "[auto] Sync starred repos $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
