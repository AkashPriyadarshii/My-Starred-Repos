name: Sync Starred Repos
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch starred repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: AkashPriyadarshii
        run: python fetch_stars.py

      - name: Bump SW cache version
        run: |
          TS=$(date +%Y%m%d%H%M)
          sed -i "s/const CACHE_VERSION = .*/const CACHE_VERSION = 'v${TS}';/" dashboard/sw.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repos_output.json CHANGELOG.md dashboard/sw.js ALL_STARRED_REPOS.md STARRED_ANALYSIS.md
          git diff --staged --quiet || git commit -m "[auto] Sync starred repos $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[auto] Sync failed ${new Date().toISOString()}`,
              body: `Check: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
