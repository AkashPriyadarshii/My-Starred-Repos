name: Keep-Alive & Backup
on:
  schedule:
    - cron: '0 0 */6 * *' # Every 6 days at 00:00 UTC (05:30 IST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run Keep-Alive & Backup Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          GITHUB_USERNAME: AkashPriyadarshii
        run: python keep_alive.py

      - name: Commit and push backup file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backup/visits_backup.csv
          git diff --staged --quiet || git commit -m "[auto] Scheduled backup of visits telemetry $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
