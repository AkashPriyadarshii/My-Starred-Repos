name: Sync stars
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - uses: actions/cache@v4
        with:
          path: .http-cache.json
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-
      # Incremental cutoff sync with count-drift repair; refreshes star counts
      # on known repos via ETag cache misses, so metadata stays honest.
      - run: |
          python fetch_stars.py --incremental
          python build_site.py
      - name: Commit if changed
        run: |
          git config user.name "AkashPriyadarshii"
          git config user.email "272530059+AkashPriyadarshii@users.noreply.github.com"
          git add repos_output.json index.html llms.txt llms-full.txt sitemap.xml
          git diff --cached --quiet || git commit -m "chore(data): sync starred repos and rebuild the snapshot"
          git push
